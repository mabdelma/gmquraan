# Ingress for all public hosts. cert-manager issues TLS per host.
#   apex / www / app / central → web (Next.js)
#   ai.*                        → agent
#   api.*  /v1/<svc>            → the microservices
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: app-ingress
  namespace: app
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - example.com
        - www.example.com
        - app.example.com
        - central.example.com
        - ai.example.com
        - api.example.com
      secretName: app-tls
  rules:
    - host: example.com
      http: &web
        paths:
          - { path: /, pathType: Prefix, backend: { service: { name: web, port: { number: 80 } } } }
    - host: www.example.com
      http: *web
    - host: app.example.com
      http: *web
    - host: central.example.com
      http: *web
    - host: ai.example.com
      http:
        paths:
          - { path: /, pathType: Prefix, backend: { service: { name: agent, port: { number: 80 } } } }
    - host: api.example.com
      http:
        paths:
          - { path: /v1/auth, pathType: Prefix, backend: { service: { name: auth, port: { number: 80 } } } }
          - { path: /v1/catalog, pathType: Prefix, backend: { service: { name: catalog, port: { number: 80 } } } }
          - { path: /v1/billing, pathType: Prefix, backend: { service: { name: billing, port: { number: 80 } } } }
          - { path: /v1/engagement, pathType: Prefix, backend: { service: { name: engagement, port: { number: 80 } } } }
