# Copy to secrets.yaml and fill real values (never commit secrets.yaml).
# Or create via: kubectl -n app create secret generic app-secrets --from-env-file=.env
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: app
type: Opaque
stringData:
  AUTH_SECRET: "change-me"
  POSTGRES_PASSWORD: "change-me"
  DATABASE_URL: "postgresql://app:change-me@postgres:5432/app"
  STRIPE_SECRET_KEY: ""
  STRIPE_WEBHOOK_SECRET: ""
  STRIPE_GROWTH_PRICE_ID: ""
  OPENAI_API_KEY: ""
  SMTP_HOST: "mailer"
  SMTP_PORT: "587"
  EMAIL_FROM: "Unskinned <noreply@example.com>"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: app
data:
  # Internal service URLs (cluster DNS) used by callService() / the web BFF.
  AUTH_URL_INTERNAL: "http://auth"
  CATALOG_URL_INTERNAL: "http://catalog"
  BILLING_URL_INTERNAL: "http://billing"
  ENGAGEMENT_URL_INTERNAL: "http://engagement"
  NOTIFICATIONS_URL_INTERNAL: "http://notifications"
  APP_URL: "https://app.example.com"
  NODE_ENV: "production"
